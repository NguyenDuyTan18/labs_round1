<VirtualHost *:80>
    ServerName fashion-shop.local
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8080/ connectiontimeout=5 timeout=30
    ProxyPassReverse / http://127.0.0.1:8080/
    ErrorLog ${APACHE_LOG_DIR}/fashion-shop-error.log
    CustomLog ${APACHE_LOG_DIR}/fashion-shop-access.log combined
</VirtualHost>
