---
- name: Install Apache web server
  ansible.builtin.apt:
    name: apache2
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Restore Apache directories missing from minimal images
  ansible.builtin.file:
    path: '{{ item.path }}'
    state: directory
    owner: '{{ item.owner }}'
    group: '{{ item.group }}'
    mode: '{{ item.mode }}'
  loop:
    - {path: /var/log/apache2, owner: root, group: adm, mode: '0750'}
    - {path: /run/apache2, owner: root, group: root, mode: '0755'}
    - {path: /var/lock/apache2, owner: www-data, group: www-data, mode: '0755'}

- name: Configure a resolvable global Apache server name
  ansible.builtin.copy:
    dest: /etc/apache2/conf-available/fashion-shop-servername.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      ServerName 127.0.0.1
  notify: Reload Apache

- name: Enable the global Apache server name
  ansible.builtin.file:
    src: /etc/apache2/conf-available/fashion-shop-servername.conf
    dest: /etc/apache2/conf-enabled/fashion-shop-servername.conf
    state: link
  notify: Reload Apache

- name: Enable Apache HTTP proxy modules
  ansible.builtin.command:
    argv: [/usr/sbin/a2enmod, proxy, proxy_http]
  register: fashion_apache_modules
  changed_when: "'Enabling module' in fashion_apache_modules.stdout"
  notify: Reload Apache

- name: Install the fashion shop virtual host
  ansible.builtin.copy:
    src: fashion-shop-apache.conf
    dest: /etc/apache2/sites-available/000-fashion-shop.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reload Apache

- name: Disable the default Apache welcome site
  ansible.builtin.file:
    path: /etc/apache2/sites-enabled/000-default.conf
    state: absent
  notify: Reload Apache

- name: Enable the fashion shop virtual host
  ansible.builtin.file:
    src: /etc/apache2/sites-available/000-fashion-shop.conf
    dest: /etc/apache2/sites-enabled/000-fashion-shop.conf
    state: link
  notify: Reload Apache

- name: Validate the complete Apache configuration
  ansible.builtin.command:
    argv: [/usr/sbin/apache2ctl, configtest]
  changed_when: false

- name: Start the Apache web service
  ansible.builtin.systemd:
    name: apache2
    enabled: true
    state: started

- name: Apply Apache configuration before checking the web service
  ansible.builtin.meta: flush_handlers
